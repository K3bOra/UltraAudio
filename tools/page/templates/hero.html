<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="1600x820">
<link rel="stylesheet" href="../base.css">
<style>:root{--w:1600px;--h:820px}
.text{position:absolute;left:96px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center}
.logo{display:flex;align-items:center;gap:6px;height:60px;margin-bottom:18px}
.logo i{display:block;width:9px;border-radius:5px;background:linear-gradient(var(--emerald),var(--crimson))}
.t1{font:600 116px/1 Cairo;color:var(--ivory);letter-spacing:2px}
.t2{font:600 116px/1.05 Cairo;color:var(--green);letter-spacing:2px}
.ar1{font:600 46px/1.5 Cairo;color:var(--rose);margin-top:6px;text-align:left}
.line{height:3px;width:260px;border-radius:3px;background:linear-gradient(90deg,var(--crimson),var(--emerald));margin:18px 0 20px}
.en{font:600 29px/1.4 Cairo;color:var(--ivory)}
.arl{font:600 27px/1.6 Cairo;color:var(--soft);margin-top:4px;text-align:left}
.shot{position:absolute;width:600px;height:338px;border-radius:14px;overflow:hidden;box-shadow:0 26px 60px rgba(0,0,0,.65)}
.shot img{display:block;width:100%;height:100%;object-fit:cover}
.shot::after{content:"";position:absolute;inset:0;border-radius:inherit;padding:2px;background:linear-gradient(90deg,var(--crimson),rgba(80,90,90,.5) 50%,var(--emerald));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.phone{position:absolute;left:1290px;top:250px;width:210px;height:426px;border-radius:34px;padding:9px;background:#05090a;
  box-shadow:0 0 0 2px rgba(125,227,160,.6),0 30px 70px rgba(0,0,0,.75);transform:rotate(4deg)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:26px;display:block}
.tag{position:absolute;font:600 18px/1 Cairo;color:var(--ivory);padding:8px 16px;border-radius:999px;background:rgba(8,19,17,.85);box-shadow:inset 0 0 0 1.5px rgba(125,227,160,.5)}
</style></head><body>
<div class="ground"></div>
<div class="shot" style="left:640px;top:70px;transform:rotate(-4deg);filter:brightness(.7)"><img src="../../../screenshots/ua-tv-theme-blue.jpg"></div>
<div class="shot" style="left:700px;top:150px;transform:rotate(-2deg);filter:brightness(.8)"><img src="../../../screenshots/ua-tv-theme-purple.jpg"></div>
<div class="shot" style="left:760px;top:230px;filter:brightness(.9)"><img src="../../../screenshots/ua-tv-theme-ruby.jpg"></div>
<div class="shot" style="left:820px;top:320px;transform:rotate(1.5deg)"><img src="../../../screenshots/ua-tv-theme-neon.jpg"></div>
<div class="phone"><img src="../../../screenshots/ua-mobile-control.jpg"></div>
<div class="tag" style="left:1300px;top:700px">http://RECEIVER-IP:9990</div>
<div class="text">
  <div class="logo"><i style="height:18px"></i><i style="height:34px"></i><i style="height:52px"></i><i style="height:28px"></i><i style="height:44px"></i><i style="height:22px"></i><i style="height:12px"></i></div>
  <div class="t1">ULTRA</div><div class="t2">AUDIO</div>
  <div class="ar1 ar">الترا أوديو</div>
  <div class="line"></div>
  <div class="en">Your picture. Your commentary.<br>Your timing.</div>
  <div class="arl ar">صورتك… تعليقك… والتوقيت على مزاجك</div>
</div>
<div class="edge"></div>
</body></html>
