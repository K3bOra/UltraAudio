<!doctype html><html lang="ar"><head><meta charset="utf-8"><meta name="size" content="1600x1010">
<link rel="stylesheet" href="../base.css">
<style>:root{--w:1600px;--h:1010px}
.grid{position:absolute;left:70px;right:70px;top:70px;bottom:70px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,1fr);gap:22px 26px;direction:rtl}
.p{display:flex;align-items:center;gap:26px;padding:0 30px}
.ic{flex:none;width:96px;height:96px;border-radius:24px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,rgba(90,24,36,.9),rgba(16,22,24,.95) 50%,rgba(14,62,46,.9));box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12),0 0 24px rgba(100,214,159,.12)}
.ic svg{width:52px;height:52px;fill:none;color:#edf6ef;stroke:#edf6ef;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.h{font:600 34px/1.3 Cairo;color:var(--ivory)}
.he{font:600 20px/1.2 Cairo;color:var(--green);margin-top:2px}
.a{font:600 22px/1.5 Cairo;color:#d6e4dd;margin-top:6px;white-space:nowrap}
</style></head><body><div class="ground"></div><div class="edge"></div><div class="grid" id="g"></div>
<script>
const I={
mic:'<rect x="19" y="5" width="14" height="26" rx="7"/><path d="M11 24a15 15 0 0 0 30 0M26 39v8M18 47h16"/>',
lib:'<path d="M5 14a3 3 0 0 1 3-3h11l5 5h20a3 3 0 0 1 3 3v21a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3z"/><path d="M18 30h16M18 24h10"/>',
m3u:'<path d="M8 12h28M8 22h28M8 32h18"/><path d="M38 28v16M31 37l7 7 7-7"/>',
phone:'<rect x="15" y="4" width="22" height="44" rx="5"/><path d="M23 41h6"/>',
sync:'<path d="M6 26h6l4-12 6 24 6-30 6 26 4-8h8"/>',
backup:'<path d="M26 6v24M17 21l9 9 9-9"/><path d="M8 32v10h36V32"/>',
theme:'<circle cx="26" cy="26" r="20"/><path d="M26 6a20 20 0 0 0 0 40z" fill="currentColor"/>',
update:'<path d="M42 22A17 17 0 0 0 11 16M10 30a17 17 0 0 0 31 6"/><path d="M42 10v12H30M10 42V30h12"/>'};
const F=[['mic','صوتية على القناة','Your commentary','صوتية إنترنت مع صورة القناة، وكتم صوتها الأصلي'],
['lib','مكتبة منظمة','Organized library','مصادر ومجلدات فرعية بالترتيب اللي يريحك'],
['m3u','قوائم M3U','Playlists','استيراد M3U، ومولدات SatFamily، Orange، Anis'],
['phone','تحكم من الموبايل','Mobile control','التشغيل والتأخير والفريز من أي موبايل على الشبكة'],
['sync','التوقيت المظبوط','Perfect timing','تأخير الصورة والصوتية كل واحد لوحده، ولكل قناة'],
['backup','نسخ احتياطي','Backup & restore','المكتبة والإعدادات والأيقونات محفوظة'],
['theme','ثيمات وخطوط','Themes & fonts','أربع ثيمات وخطوط عربية وإنجليزية'],
['update','تحديث رسمي','Official updates','فحص في الخلفية وتأكيد بصمة الحزمة قبل التثبيت']];
g.innerHTML=F.map(([i,h,he,a])=>`<div class="p glass"><div class="ic"><svg viewBox="0 0 52 52">${I[i]}</svg></div><div class="ar" style="text-align:right;flex:1"><div class="h">${h}</div><div class="he" style="direction:ltr;text-align:right">${he}</div><div class="a">${a}</div></div></div>`).join('');

</script></body></html>
